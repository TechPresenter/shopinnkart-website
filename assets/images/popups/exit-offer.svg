  </g>

  <g fill="#FFFFFF" opacity=".7">
    <rect x="140" y="66" width="10" height="10" rx="2" transform="rotate(20 145 71)"/>
    <circle cx="176" cy="150" r="5"/>
    <rect x="120" y="168" width="8" height="8" rx="2" transform="rotate(-22 124 172)"/>
