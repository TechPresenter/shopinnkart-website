<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Special offer before you go">
  <defs>
    <linearGradient id="eoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2143"/>
      <stop offset="1" stop-color="#1B335F"/>
    </linearGradient>
  </defs>
  <rect width="640" height="240" fill="url(#eoBg)"/>
  <circle cx="588" cy="34" r="126" fill="#F4511E" opacity=".18"/>
  <circle cx="58" cy="212" r="104" fill="#F4511E" opacity=".1"/>

  <!-- gift box -->
  <g transform="translate(256 52)">
    <rect x="0" y="52" width="128" height="86" rx="8" fill="#F4511E"/>
    <rect x="-10" y="34" width="148" height="30" rx="7" fill="#FF8A3D"/>
    <rect x="54" y="34" width="20" height="104" fill="#FFFFFF" opacity=".92"/>
    <path d="M64 34c-16-2-30-10-30-20a14 14 0 0 1 28-2c1 8 2 15 2 22z" fill="#FFFFFF" opacity=".92"/>
    <path d="M64 34c16-2 30-10 30-20a14 14 0 0 0-28-2c-1 8-2 15-2 22z" fill="#FFFFFF" opacity=".92"/>
  </g>

  <!-- percent badge -->
